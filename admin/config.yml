# Panel de administración de la web de Nyos Consulting (Sveltia CMS). Cómo se instala: docs/panel.md.
#
# Cada colección refleja un schema de lib/content/schemas.ts: los nombres de campo, las listas
# cerradas y los textos de ayuda salen de ahí. Si cambia un schema, cambia esto.
#
# En la demo (scripts/build-demo.mjs) el backend se sustituye por `test-repo` y se siembra el
# contenido actual: el panel se puede probar sin cuenta de GitHub y nada se guarda de verdad.

backend:
  name: test-repo


# Nombres de archivo en ASCII, sin acentos: son las URL de la web.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# Un campo opcional vacío no se escribe: los schemas esperan que no exista, no que esté vacío.
output:
  omit_empty_optional_fields: true
  yaml:
    quote: double
    indent_sequences: true

# Archivos content/<colección>/<slug>.<idioma>.mdx: un archivo por idioma, con el mismo nombre (slug) en
# todos. Los idiomas son los de i18n/routing.ts. En cada campo, `i18n: true` es un texto que se traduce
# y `i18n: duplicate` un dato que es el mismo en todos los idiomas (coordenadas, fechas, listas
# cerradas): se rellena una vez, en español, y el panel lo copia a los demás archivos.
i18n:
  structure: multiple_files
  locales: [es, en]
  default_locale: es

media_folder: /public/proyectos
public_folder: /proyectos

collections:
  - name: proyectos
    label: Nuestro trabajo
    label_singular: Obra
    description: Cada obra tiene su ficha, su foto y su lugar en el mapa. Lo que se deje en blanco no se publica.
    folder: /content/proyectos
    extension: mdx
    format: yaml-frontmatter
    i18n: true
    create: true
    slug: "{{titulo}}"
    identifier_field: titulo
    summary: "{{titulo}} · {{municipio}}"
    sortable_fields: [titulo, municipio, anio]
    fields:
      - { name: titulo, label: Título, widget: string, i18n: true, hint: "Nombre de la obra tal y como quieren que aparezca. Ej.: EDAR Santa Amalia" }
      - { name: municipio, label: Municipio, widget: string, i18n: true }
      - { name: provincia, label: Provincia, widget: select, i18n: true, options: [Badajoz, Cáceres] }
      - name: coords
        label: Coordenadas del municipio
        widget: object
        i18n: duplicate
        collapsed: auto
        summary: "{{lat}}, {{lng}}"
        fields:
          - { name: lat, label: Latitud, widget: number, value_type: float, min: -90, max: 90, step: 0.0001, hint: "Ej.: 39.47" }
          - { name: lng, label: Longitud, widget: number, value_type: float, min: -180, max: 180, step: 0.0001, hint: "Ej.: -6.37 (oeste, en negativo)" }
          - { name: precision, label: Precisión, widget: select, default: municipio, options: [{ label: "Centro del municipio", value: municipio }, { label: "Punto exacto de la obra", value: exacta }] }
      - name: origen
        label: De quién es el trabajo
        widget: select
        i18n: duplicate
        hint: "Decide en qué bloque del listado sale."
        options:
          - { label: "Proyecto de NYOS", value: nyos }
          - { label: "Experiencia previa del equipo", value: equipo }
      - name: sectores
        label: Sector
        widget: select
        i18n: duplicate
        required: false
        multiple: true
        hint: "Es el primer filtro del listado."
        options:
          - { label: "Ferrocarril", value: ferrocarril }
          - { label: "Carreteras", value: carreteras }
          - { label: "Agua", value: agua }
          - { label: "Medio ambiente", value: medio-ambiente }
          - { label: "Urbanismo", value: urbanismo }
          - { label: "Estructuras", value: estructuras }
      - name: etiquetas
        label: Etiquetas técnicas
        widget: select
        i18n: duplicate
        required: false
        multiple: true
        options:
          - { label: "Dron", value: dron }
          - { label: "GIS", value: gis }
          - { label: "Modelización 3D", value: modelizacion-3d }
          - { label: "Fotografía técnica", value: fotografia-tecnica }
          - { label: "Instrumentación", value: instrumentacion }
          - { label: "Sensores", value: sensores }
      - name: areas
        label: Áreas relacionadas
        widget: select
        i18n: duplicate
        required: false
        multiple: true
        hint: "La obra aparece en la página de cada área marcada."
        options: &areas
          - { label: "Infraestructura ferroviaria", value: infraestructura-ferroviaria }
          - { label: "Carreteras e infraestructuras viarias", value: carreteras }
          - { label: "Agua y medio ambiente", value: agua-y-medio-ambiente }
          - { label: "Urbanismo y ordenación del territorio", value: urbanismo-y-ordenacion-del-territorio }
          - { label: "Asistencia técnica, dirección de obra y CSS", value: asistencia-tecnica-y-direccion-de-obra }
          - { label: "Cálculo de estructuras", value: calculo-de-estructuras }
          - { label: "Auscultación y monitorización", value: auscultacion-y-monitorizacion }
      - { name: cliente, label: Cliente o promotor, widget: string, i18n: true, required: false, hint: "Si no se puede publicar, dejarlo en blanco." }
      - { name: anio, label: Año, widget: number, i18n: duplicate, required: false, value_type: int, min: 1900, max: 2100 }
      - { name: alcance, label: Alcance, widget: text, i18n: true, required: false, hint: "Qué hizo NYOS, en una o dos frases. Ej.: Redacción del proyecto y asistencia técnica a la Dirección de Obra." }
      - name: rol
        label: Papel de Nyos (servicio prestado)
        widget: select
        i18n: duplicate
        multiple: true
        min: 1
        options:
          - { label: "Proyecto", value: proyecto }
          - { label: "Planeamiento urbanístico", value: planeamiento-urbanistico }
          - { label: "Asistencia técnica", value: asistencia-tecnica }
          - { label: "Dirección de obra", value: direccion-de-obra }
          - { label: "Coordinación de seguridad y salud (CSS)", value: coordinacion-seguridad-salud }
          - { label: "Control", value: control }
          - { label: "Auscultación", value: auscultacion }
      - name: datosClave
        label: Datos clave
        label_singular: Dato
        widget: list
        i18n: true
        required: false
        collapsed: auto
        summary: "{{etiqueta}}: {{valor}} {{unidad}}"
        hint: "Dos o tres cifras verificables: longitud, caudal, superficie, habitantes equivalentes…"
        fields:
          - { name: etiqueta, label: Qué se mide, widget: string, hint: "Ej.: Caudal" }
          - { name: valor, label: Valor, widget: string, hint: "Ej.: 1200" }
          - { name: unidad, label: Unidad, widget: string, required: false, hint: "Ej.: m³/día" }
      - name: portada
        label: Portada
        widget: object
        i18n: true
        typeKey: tipo
        types:
          - name: foto
            label: Foto
            summary: "{{alt}}"
            fields: &imagen
              - { name: src, label: Imagen, widget: image, hint: "Horizontal, al menos 1600 px de ancho y sin marca de agua." }
              - { name: alt, label: Descripción de la imagen, widget: string, hint: "Qué se ve, para quien no puede verla. Ej.: Decantador circular de la EDAR con el puente barredor azul" }
          - name: render
            label: Render
            summary: "{{alt}}"
            fields: *imagen
          - name: esquema
            label: Solo el esquema dibujado
      - name: galeria
        label: Galería
        label_singular: Imagen
        widget: list
        i18n: true
        required: false
        collapsed: auto
        summary: "{{alt}}"
        fields:
          - { name: src, label: Imagen, widget: image }
          - { name: alt, label: Descripción de la imagen, widget: string }
          - { name: tipo, label: Tipo, widget: select, default: foto, options: [{ label: Foto, value: foto }, { label: Render, value: render }] }
      - name: planoSvg
        label: Esquema dibujado
        widget: select
        i18n: duplicate
        required: false
        hint: "Solo para las obras que tienen dibujo propio. Las nuevas se dejan en blanco."
        options:
          - { label: "Ronda Norte de Cáceres", value: ronda-norte }
          - { label: "EDAR La Codosera", value: edar-la-codosera }
          - { label: "Club de Piragüismo", value: club-piraguismo }
          - { label: "Río Guadiana", value: rio-guadiana }
          - { label: "EDAR Santa Amalia", value: edar-santa-amalia }
          - { label: "Gran Hotel Casino", value: gran-hotel-casino }
      - { name: planoConfirmado, label: El dibujo es el plano real, widget: boolean, i18n: duplicate, default: false, hint: "Solo si Nyos ha entregado la geometría y el dibujo la reproduce." }
      - { name: destacado, label: Destacada en la portada, widget: boolean, i18n: duplicate, default: false }
      - name: seo
        label: Buscadores
        widget: object
        i18n: true
        collapsed: auto
        fields:
          - { name: title, label: Título en Google, widget: string, pattern: ["^.{1,60}$", "Como mucho 60 caracteres"], hint: "Ej.: EDAR Santa Amalia, Badajoz | Nyos Consulting" }
          - { name: description, label: Descripción en Google, widget: text, pattern: ["^.{140,160}$", "Entre 140 y 160 caracteres"] }
      - { name: body, label: Texto de la ficha, widget: markdown, i18n: true, hint: "Apartados habituales: Proyecto, Reto, Solución y Rol de Nyos." }

  - name: campanas
    label: Campañas
    label_singular: Campaña
    description: Acciones comerciales con plazo. Al terminar el plazo pasan solas a «Finalizadas».
    folder: /content/campanas
    extension: mdx
    format: yaml-frontmatter
    i18n: true
    create: true
    slug: "{{titulo}}"
    identifier_field: titulo
    summary: "{{titulo}} · hasta {{fin}}"
    media_folder: /public/campanas
    public_folder: /campanas
    fields:
      - { name: titulo, label: Título, widget: string, i18n: true }
      - { name: resumen, label: Resumen, widget: text, i18n: true, hint: "Dos frases: qué se ofrece y para qué sirve." }
      - { name: inicio, label: Empieza el, widget: datetime, i18n: duplicate, type: date }
      - { name: fin, label: Termina el, widget: datetime, i18n: duplicate, type: date }
      - { name: paraQuien, label: A quién va dirigida, widget: list, i18n: true, min: 1, field: { name: perfil, label: Perfil, widget: string }, hint: "Ej.: Ayuntamientos y mancomunidades" }
      - { name: areas, label: Áreas, widget: select, i18n: duplicate, multiple: true, min: 1, options: *areas }
      - name: imagen
        label: Imagen
        widget: object
        i18n: true
        required: false
        collapsed: auto
        fields:
          - { name: src, label: Imagen, widget: image }
          - { name: alt, label: Descripción de la imagen, widget: string }
          - { name: tipo, label: Tipo, widget: select, default: foto, options: [{ label: Foto, value: foto }, { label: Render, value: render }] }
      - { name: ejemplo, label: Es un ejemplo de la demo, widget: boolean, i18n: duplicate, default: false, hint: "Marcado, no se publica en la web real." }
      - name: seo
        label: Buscadores
        widget: object
        i18n: true
        collapsed: auto
        fields:
          - { name: title, label: Título en Google, widget: string, pattern: ["^.{1,60}$", "Como mucho 60 caracteres"] }
          - { name: description, label: Descripción en Google, widget: text, pattern: ["^.{140,160}$", "Entre 140 y 160 caracteres"] }
      - { name: body, label: Texto de la campaña, widget: markdown, i18n: true, hint: "Qué incluye y cómo se pide." }

  - name: noticias
    label: Actualidad
    label_singular: Noticia
    description: Sale en la portada y en el pie. Sin noticias, el apartado no aparece en la web.
    folder: /content/noticias
    extension: mdx
    format: yaml-frontmatter
    i18n: true
    create: true
    slug: "{{titulo}}"
    identifier_field: titulo
    summary: "{{fecha}} · {{titulo}}"
    sortable_fields: [fecha, titulo]
    media_folder: /public/noticias
    public_folder: /noticias
    fields:
      - { name: titulo, label: Título, widget: string, i18n: true }
      - { name: fecha, label: Fecha, widget: datetime, i18n: duplicate, type: date }
      - { name: ejemplo, label: Es un ejemplo de la demo, widget: boolean, i18n: duplicate, default: false, hint: "Marcado, no se publica en la web real." }
      - { name: resumen, label: Resumen, widget: text, i18n: true }
      - name: imagen
        label: Imagen
        widget: object
        i18n: true
        required: false
        collapsed: auto
        fields:
          - { name: src, label: Imagen, widget: image }
          - { name: alt, label: Descripción de la imagen, widget: string }
          - { name: tipo, label: Tipo, widget: select, default: foto, options: [{ label: Foto, value: foto }, { label: Render, value: render }] }
      - name: seo
        label: Buscadores
        widget: object
        i18n: true
        collapsed: auto
        fields:
          - { name: title, label: Título en Google, widget: string, pattern: ["^.{1,60}$", "Como mucho 60 caracteres"] }
          - { name: description, label: Descripción en Google, widget: text, pattern: ["^.{140,160}$", "Entre 140 y 160 caracteres"] }
      - { name: body, label: Texto de la noticia, widget: markdown, i18n: true }

  - name: servicios
    label: Áreas
    label_singular: Área
    description: Las siete áreas de actividad. No se crean ni se borran desde aquí; sí se editan sus textos.
    folder: /content/servicios
    extension: mdx
    format: yaml-frontmatter
    i18n: true
    create: false
    delete: false
    summary: "{{orden}}. {{titulo}}"
    sortable_fields: [orden]
    fields:
      - { name: orden, label: Orden, widget: number, i18n: duplicate, value_type: int, min: 1, max: 20 }
      - { name: titulo, label: Título, widget: string, i18n: true }
      - { name: resumen, label: Resumen, widget: text, i18n: true }
      - { name: icono, label: Icono, widget: select, i18n: duplicate, options: *areas, hint: "No cambiar: es el dibujo del servicio." }
      - { name: prestaciones, label: Qué incluye, widget: list, i18n: true, min: 1, field: { name: prestacion, label: Prestación, widget: string } }
      - { name: paraQuien, label: Perfiles habituales, widget: list, i18n: true, required: false, field: { name: perfil, label: Perfil, widget: string }, hint: "En blanco, el bloque no aparece." }
      - name: faq
        label: Preguntas frecuentes del servicio
        label_singular: Pregunta
        widget: list
        i18n: true
        required: false
        collapsed: auto
        summary: "{{pregunta}}"
        fields:
          - { name: pregunta, label: Pregunta, widget: string }
          - { name: respuesta, label: Respuesta, widget: text }
      - { name: proyectosRelacionados, label: Obras destacadas (por orden), widget: relation, i18n: duplicate, required: false, multiple: true, collection: proyectos, value_field: "{{slug}}", display_fields: ["{{titulo}}"], search_fields: [titulo, municipio], hint: "En blanco, salen todas las obras del área." }
      - name: seo
        label: Buscadores
        widget: object
        i18n: true
        collapsed: auto
        fields:
          - { name: title, label: Título en Google, widget: string, pattern: ["^.{1,60}$", "Como mucho 60 caracteres"] }
          - { name: description, label: Descripción en Google, widget: text, pattern: ["^.{140,160}$", "Entre 140 y 160 caracteres"] }
      - { name: body, label: Texto del área, widget: markdown, i18n: true }

  - name: legal
    label: Textos legales
    label_singular: Texto legal
    folder: /content/legal
    extension: mdx
    format: yaml-frontmatter
    i18n: true
    create: false
    delete: false
    fields:
      - { name: titulo, label: Título, widget: string, i18n: true }
      - name: seo
        label: Buscadores
        widget: object
        i18n: true
        collapsed: auto
        fields:
          - { name: title, label: Título en Google, widget: string, pattern: ["^.{1,60}$", "Como mucho 60 caracteres"] }
          - { name: description, label: Descripción en Google, widget: text, pattern: ["^.{140,160}$", "Entre 140 y 160 caracteres"] }
      - { name: body, label: Texto, widget: markdown, i18n: true }

  - name: datos
    label: Datos de la empresa
    description: Ficha societaria, cifras y preguntas frecuentes generales. Las entradas «(inglés)» llevan solo los textos que cambian; el resto sale de la entrada en español.
    files:
      - name: empresa
        label: Empresa
        file: /content/empresa.json
        fields:
          - { name: nombreComercial, label: Nombre comercial, widget: string }
          - { name: eslogan, label: Eslogan, widget: string }
          - { name: razonSocial, label: Razón social, widget: string }
          - { name: cif, label: CIF, widget: string }
          - { name: domicilio, label: Domicilio social, widget: string }
          - { name: telefono, label: Teléfono, widget: string }
          - { name: email, label: Correo de contacto, widget: string }
          - { name: horario, label: Horario de atención, widget: string, required: false, hint: "En blanco, la fila no aparece." }
          - { name: anioConstitucion, label: Año de constitución, widget: number, value_type: int, min: 1900, max: 2100 }
          - { name: certificaciones, label: Certificaciones, widget: list, required: false, field: { name: certificacion, label: Certificación, widget: string }, hint: "Ej.: ISO 9001. En blanco, el bloque no aparece." }
          - name: equipo
            label: Equipo
            label_singular: Persona
            widget: list
            required: false
            collapsed: auto
            summary: "{{nombre}} · {{cargo}}"
            fields:
              - { name: nombre, label: Nombre, widget: string }
              - { name: cargo, label: Cargo, widget: string }
          - name: redes
            label: Redes sociales
            label_singular: Red
            widget: list
            required: false
            collapsed: auto
            summary: "{{red}}"
            fields:
              - { name: red, label: Red, widget: string, hint: "Ej.: LinkedIn" }
              - { name: url, label: Dirección, widget: string, pattern: ["^https://", "Tiene que empezar por https://"] }
          - { name: presentacion, label: Quiénes somos, widget: list, min: 1, field: { name: parrafo, label: Párrafo, widget: text } }
          - { name: politicaGestion, label: Política de Gestión Integrada, widget: list, min: 1, field: { name: parrafo, label: Párrafo, widget: text } }
      - name: empresa-en
        label: Empresa (inglés)
        file: /content/empresa.en.json
        description: "Solo los textos que cambian en inglés. Lo que se deje en blanco sale como en «Empresa»: CIF, teléfono, correo y año se escriben allí una sola vez."
        fields:
          - { name: eslogan, label: Eslogan, widget: string, required: false, hint: "En blanco, se usa el texto en español." }
          - { name: horario, label: Horario de atención, widget: string, required: false, hint: "En blanco, se usa el texto en español." }
          - { name: certificaciones, label: Certificaciones, widget: list, required: false, field: { name: certificacion, label: Certificación, widget: string }, hint: "En blanco, se usa el texto en español." }
          - name: equipo
            label: Equipo
            label_singular: Persona
            widget: list
            required: false
            collapsed: auto
            summary: "{{nombre}} · {{cargo}}"
            hint: "Si se rellena, sustituye a la lista entera en español: hay que poner a todas las personas, con el cargo en inglés."
            fields:
              - { name: nombre, label: Nombre, widget: string }
              - { name: cargo, label: Cargo, widget: string }
          - { name: presentacion, label: Quiénes somos, widget: list, required: false, field: { name: parrafo, label: Párrafo, widget: text } }
          - { name: politicaGestion, label: Política de Gestión Integrada, widget: list, required: false, field: { name: parrafo, label: Párrafo, widget: text } }
      - name: capacidades
        label: Capacidades transversales
        file: /content/capacidades.json
        fields:
          - name: capacidades
            label: Capacidades
            label_singular: Capacidad
            widget: list
            collapsed: auto
            summary: "{{titulo}}"
            hint: "Salen en la página de Áreas."
            fields:
              - name: clave
                label: Etiqueta
                widget: select
                options:
                  - { label: "Dron", value: dron }
                  - { label: "GIS", value: gis }
                  - { label: "Modelización 3D", value: modelizacion-3d }
                  - { label: "Fotografía técnica", value: fotografia-tecnica }
              - { name: titulo, label: Título, widget: string }
              - { name: texto, label: Texto, widget: text }
              - { name: aplicacion, label: Aplicación habitual, widget: list, min: 1, field: { name: ambito, label: Ámbito, widget: string } }
      - name: capacidades-en
        label: Capacidades transversales (inglés)
        file: /content/capacidades.en.json
        description: "La lista en inglés sustituye entera a la española: tiene que llevar las mismas capacidades, con la misma etiqueta."
        fields:
          - name: capacidades
            label: Capacidades
            label_singular: Capacidad
            widget: list
            required: false
            collapsed: auto
            summary: "{{titulo}}"
            fields:
              - name: clave
                label: Etiqueta
                widget: select
                options:
                  - { label: "Dron", value: dron }
                  - { label: "GIS", value: gis }
                  - { label: "Modelización 3D", value: modelizacion-3d }
                  - { label: "Fotografía técnica", value: fotografia-tecnica }
              - { name: titulo, label: Título, widget: string }
              - { name: texto, label: Texto, widget: text }
              - { name: aplicacion, label: Aplicación habitual, widget: list, min: 1, field: { name: ambito, label: Ámbito, widget: string } }
      - name: idi
        label: I+D+i
        file: /content/idi.json
        fields:
          - { name: presentacion, label: Presentación, widget: list, min: 1, field: { name: parrafo, label: Párrafo, widget: text } }
          - { name: lineas, label: Qué recoge la sección, widget: list, required: false, field: { name: linea, label: Línea, widget: string } }
          - { name: areasRelacionadas, label: Áreas relacionadas, widget: select, required: false, multiple: true, options: *areas }
          - { name: proyectos, label: Proyectos de investigación aplicada, widget: relation, required: false, multiple: true, collection: proyectos, value_field: "{{slug}}", display_fields: ["{{titulo}}"], search_fields: [titulo, municipio], hint: "Proyectos con la UEx o de transferencia. En blanco, el bloque no aparece." }
      - name: idi-en
        label: I+D+i (inglés)
        file: /content/idi.en.json
        description: "Solo los textos. Las áreas relacionadas se eligen en «I+D+i» y valen para los dos idiomas."
        fields:
          - { name: presentacion, label: Presentación, widget: list, required: false, field: { name: parrafo, label: Párrafo, widget: text } }
          - { name: lineas, label: Qué recoge la sección, widget: list, required: false, field: { name: linea, label: Línea, widget: string } }
      - name: cifras
        label: Cifras
        file: /content/cifras.json
        fields:
          - name: cifras
            label: Cifras de la portada
            label_singular: Cifra
            widget: list
            required: false
            collapsed: auto
            summary: "{{valor}} {{unidad}} · {{etiqueta}}"
            hint: "Solo cifras verificables. Sin ninguna, la sección no aparece."
            fields:
              - { name: valor, label: Valor, widget: number, value_type: float }
              - { name: decimales, label: Decimales, widget: number, required: false, value_type: int, min: 0, max: 3 }
